spring:
  application:
    name: customerservice

  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/orclpdb
    username: CUSTOMER
    password: strong_password

  jpa:
    hibernate:
      ddl-auto: none   # optional, uncomment if you want schema auto-update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect

server:
  port: 8083

customerlogin:
  service:
    url: http://localhost:8082/v1/api/customer
customer:
  service:
    url: http://localhost:8083/v1/api/customer

vendor:
  service:
    url: http://localhost:8085/v1/api/vendor

transaction:
  service:
    url: http://localhost:8087/v1/api/transaction/log

